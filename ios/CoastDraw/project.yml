name: CoastDraw
options:
  bundleIdPrefix: com.fivedeestudios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
targets:
  CoastDraw:
    type: application
    platform: iOS
    sources: [CoastDrawApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fivedeestudios.coastdraw
        INFOPLIST_FILE: CoastDrawApp/Info.plist
    dependencies:
      - target: CoastDrawMessages
        embed: true
  CoastDrawMessages:
    type: app-extension
    platform: iOS
    sources: [MessagesExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fivedeestudios.coastdraw.MessagesExtension
        INFOPLIST_FILE: MessagesExtension/Info.plist
        PRODUCT_NAME: COAST Draw
schemes:
  CoastDraw:
    build:
      targets:
        CoastDraw: all
        CoastDrawMessages: all
